name: build

on:
  push:
    branches: ["main", "feat/**", "fix/**", "ci/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Checked on Linux only: a Windows checkout may convert line endings,
      # which gofmt reports as a formatting difference.
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

  # Every target is cross-compiled on Linux. The code is pure Go with cgo off,
  # so a runner per platform bought only queue time and a standing dependency on
  # macOS image labels staying current. Native compilation is still covered by
  # the test job, which runs on all three operating systems.
  build:
    name: build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: macos-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # A tag build stamps its own name into the binary; every other build says
      # dev.
      - name: Build server
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          version="dev"
          case "${{ github.ref }}" in
            refs/tags/*) version="${{ github.ref_name }}" ;;
          esac
          go build -trimpath \
            -ldflags "-X github.com/snakex21/devspace-go/internal/version.Version=${version}" \
            -o "dist/mcp-webcoder${{ matrix.ext }}" ./cmd/devspace/

      - name: List artifacts
        run: ls -lh dist

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-webcoder-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  release:
    name: release ${{ github.ref_name }}
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # One archive per target, named after the tag, so a download still says
      # what it is once it has left the browser. Windows gets a zip because that
      # is what Explorer opens without help.
      - name: Package each target
        run: |
          mkdir -p release
          for dir in artifacts/mcp-webcoder-*; do
            target="${dir#artifacts/mcp-webcoder-}"
            name="mcp-webcoder-${{ github.ref_name }}-${target}"
            case "$target" in
              windows-*)
                (cd "$dir" && zip -qr "../../release/${name}.zip" .)
                ;;
              *)
                chmod +x "$dir/mcp-webcoder"
                tar -czf "release/${name}.tar.gz" -C "$dir" .
                ;;
            esac
          done
          ls -lh release

      # gh ships on the runner, so the release needs no third-party action. Re-running
      # a tag replaces the assets instead of failing on a release that exists.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber --repo "$repo"
          else
            gh release create "$tag" release/* --repo "$repo" --title "$tag" --generate-notes
          fi
